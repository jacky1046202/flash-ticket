spring:
  datasource:
    # 指定連接 flash_ticket 資料庫，並設定時區
    url: jdbc:mysql://localhost:3306/flash_ticket?allowPublicKeyRetrieval=true&useSSL=false
    username: root
    password: a123  # TODO: 替換成你的 MySQL 密碼
    driver-class-name: com.mysql.cj.jdbc.Driver

  data:
    redis:
      host: localhost
      port: 6379

  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
    listener:
      simple:
        # 消費失敗重試 3 次後不重新入列, 改送死信佇列 (DLQ)
        default-requeue-rejected: false
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 1000

  jpa:
    hibernate:
      # update: 每次啟動伺服器時，若 Entity (Java 類別) 結構有變，會自動幫你修改資料表結構
      ddl-auto: update
    # 在終端機印出底層轉換的 SQL 語法，這對初期學習除錯非常有幫助
#    show-sql: true